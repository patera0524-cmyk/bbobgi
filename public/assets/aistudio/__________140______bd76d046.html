<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINTER GIFT FESTIVAL · 140칸 한 화면 뽑기</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
:root{font-family:'Nunito','Noto Sans KR',sans-serif;color:#fff;background:#091b45}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0%,#385cbb 0%,transparent 42%),radial-gradient(ellipse at 0% 75%,#155f91 0%,transparent 48%),linear-gradient(135deg,#071a3f,#183f86 55%,#092b5a);overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(white 1.3px,transparent 1.5px),radial-gradient(#b7ecff 1px,transparent 1.5px);background-size:83px 93px,127px 119px;background-position:15px 20px,65px 74px}.shell{max-width:1520px;margin:auto;padding:12px 24px 16px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:13px;font-weight:900;letter-spacing:3px;color:#bceeff}.actions{display:flex;gap:9px}.smallbtn{background:#ffffff1b;color:white;border:1px solid #ffffff48;border-radius:14px;padding:11px 15px;font:800 14px inherit;cursor:pointer;backdrop-filter:blur(12px)}.smallbtn:hover{background:#ffffff35}.hero{text-align:center;margin:2px auto 10px}.eyebrow{display:inline-block;border:1px solid #a8e9ff7a;background:#c1edff1a;border-radius:100px;padding:7px 20px;color:#c5f2ff;font-size:12px;font-weight:900;letter-spacing:2px}.hero h1{margin:8px 0 0;font-size:clamp(30px,3.5vw,52px);font-weight:900;letter-spacing:-3px;text-shadow:0 5px 0 #0a387b,0 10px 30px #65baff77}.hero h1 em{font-style:normal;color:#b9efff}.hero p{margin:6px 0;color:#cce6ff;font-size:15px}.stage{border:1px solid #a7ddff85;border-radius:30px;padding:14px 18px 18px;background:linear-gradient(160deg,#ffffff24,#ffffff0a);box-shadow:0 25px 80px #00133377,inset 0 1px #ffffff70;backdrop-filter:blur(12px)}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px}.stat{font-weight:800;color:#d8efff}.stat b{color:#fff;font-size:24px}.progress{height:8px;background:#ffffff30;border-radius:20px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#79e6fa,#b1a3ff,#ffd5a8);transition:width .4s}.grid{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:clamp(4px,.55vw,9px)}.tile{height:clamp(31px,calc((100dvh - 280px)/10),76px);border:1px solid #ffffffa8;border-radius:12px;cursor:pointer;background:linear-gradient(150deg,#f9feff,#b9e9ff 70%,#a8c9fa);box-shadow:0 6px 0 #397db0,0 11px 19px #001a4d75,inset 0 2px 0 #fff;position:relative;color:#2f84c6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;transition:transform .16s,box-shadow .16s;user-select:none}.tile:not(:disabled):hover{transform:translateY(-5px);box-shadow:0 11px 0 #397db0,0 17px 25px #001a4d75,inset 0 2px #fff}.tile:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #397db0}.tile .flake{font-size:clamp(19px,2.5vw,34px);line-height:1;filter:drop-shadow(0 2px #fff)}.tile .num{font-size:10px;font-weight:900;color:#5686b1}.tile.used{background:linear-gradient(150deg,#344c83,#29416f);box-shadow:inset 0 2px 9px #051638;color:#a3b7d4;border-color:#7592bb66;cursor:default}.tile.used .flake{font-size:30px;filter:none;opacity:.8}.tile.used .num{color:#c1cde0}.pager{display:none;align-items:center;justify-content:center;gap:16px;margin-top:23px}.pagebtn{border:1px solid #ffffff88;background:#ffffff24;color:#fff;border-radius:15px;padding:12px 20px;font:inherit;font-weight:900;cursor:pointer}.pagebtn:disabled{opacity:.3;cursor:default}.pagecount{font-weight:900;color:#d5eeff;min-width:110px;text-align:center}.footer{text-align:center;color:#bcdcf6;font-size:13px;margin-top:9px}.snowman{position:absolute;bottom:12px;left:12px;font-size:42px;pointer-events:none}.penguin{position:absolute;bottom:12px;right:12px;font-size:42px;pointer-events:none}.overlay{position:fixed;inset:0;z-index:20;background:#061530b9;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(9px)}.hidden{display:none!important}.modal{background:linear-gradient(160deg,#fafdff,#e4f3ff);border:2px solid #fff;border-radius:28px;color:#173d72;box-shadow:0 28px 100px #0008;width:min(590px,100%);padding:26px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px;font-size:25px}.modal p{color:#58769b}.formrow{display:flex;gap:10px;align-items:center;margin:10px 0}.formrow input{min-width:0;border:1px solid #c3d6eb;border-radius:11px;padding:12px;font:inherit;color:#173d72;background:#fff}.formrow input[type=number]{width:92px}.formrow input[type=text]{flex:1}.formrow button{border:0;background:#e2eafa;border-radius:10px;padding:11px;cursor:pointer;color:#34588c}.label{font-size:13px;font-weight:800;color:#58769b;margin-top:15px}.primary{background:linear-gradient(110deg,#6551e8,#3b9dea);border:0;border-radius:14px;padding:14px 20px;color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 6px 14px #4777c344}.secondary{background:#dceaf9;color:#2a568c;border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.modalbuttons{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.note{font-size:12px;color:#6683a4}.prizebox{text-align:center;padding:30px 8px}.prizebox .gift{font-size:76px;animation:bounce .65s ease infinite alternate}.prizebox h2{font-size:clamp(28px,6vw,42px);margin:10px 0;color:#3153a4}.prizebox .win{font-size:19px;font-weight:900;color:#7384ab}.confetti{font-size:35px;letter-spacing:13px}.resultitem{display:flex;justify-content:space-between;border-bottom:1px solid #d6e6f6;padding:10px 0;font-weight:800}.warn{color:#bb4b62!important}.fullscreenhint{font-size:12px;color:#bedff8;text-align:center;margin-top:10px}@keyframes bounce{to{transform:translateY(-12px) rotate(6deg)}}@media(max-width:850px){.shell{padding:15px}.grid{grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}.tile{height:clamp(28px,calc((100dvh - 235px)/10),58px)}.tile .flake{font-size:19px}.tile .num{font-size:8px}.stage{padding:15px}.hero h1{letter-spacing:-2px}.snowman,.penguin{display:none}}@media(max-width:430px){.grid{grid-template-columns:repeat(14,minmax(0,1fr))}.tile{height:32px;padding:0;border-radius:6px}.tile .flake{font-size:14px}.tile .num{font-size:7px}.smallbtn{padding:9px}.hero p{font-size:12px}.brand{font-size:10px}}
@media(max-height:650px) and (min-width:851px){.hero p{display:none}.hero{margin-bottom:5px}.eyebrow{padding:3px 12px}.tile{height:clamp(27px,calc((100dvh - 205px)/10),55px)}.stage{padding:9px 14px}.progress{margin-bottom:8px}}@media(max-width:650px){.shell{min-width:650px}.tile{height:36px}.hero h1{font-size:30px}}
</style></head><body><div class="shell"><div class="top"><div class="brand">✦ WINTER GIFT FESTIVAL ✦</div><div class="actions"><button class="smallbtn" id="resultsBtn">📊 결과</button><button class="smallbtn" id="fullBtn">⛶ 전체화면</button><button class="smallbtn" id="settingsBtn">⚙ 설정</button></div></div><div class="hero"><span class="eyebrow">❄ SNOWY LUCKY DAY ❄</span><h1>설레는 <em>겨울 뽑기</em> ✨</h1><p>140개의 눈꽃 중 마음에 드는 하나를 골라 톡! 오늘의 행운을 만나보세요</p></div><section class="stage"><div class="stats"><span class="stat">🎁 남은 선물 <b id="remaining">140</b>개</span><span class="stat">참여 현황 <b id="done">0</b> / <span id="total">140</span></span></div><div class="progress"><i id="bar"></i></div><div id="grid" class="grid"></div><div class="pager"><button class="pagebtn" id="prev">❮ 이전</button><span class="pagecount" id="pagecount"></span><button class="pagebtn" id="next">다음 ❯</button></div></section><div class="footer">❄ 140개의 눈꽃이 한 화면에! 마음에 드는 눈꽃을 선택해요 ❄</div><div class="snowman">☃️</div><div class="penguin">🐧</div></div>
<div class="overlay hidden" id="settingsOverlay"><div class="modal"><h2>⚙ 선생님 설정</h2><p>상품 수량의 합계는 전체 학생 수와 같아야 합니다.</p><div class="label">전체 학생 수</div><div class="formrow"><input id="studentCount" type="number" min="1" max="1000" value="140"><span>명</span></div><div class="label">상품 이름 · 당첨 인원</div><div id="prizeRows"></div><button class="secondary" id="addPrize">＋ 상품 추가</button><p class="note" id="sumText"></p><div class="modalbuttons"><button class="secondary" id="closeSettings">취소</button><button class="primary" id="saveSettings">🎁 뽑기판 만들기</button></div><p class="note warn">※ 뽑기판을 새로 만들면 기존 결과가 초기화됩니다.</p></div></div>
<div class="overlay hidden" id="winOverlay"><div class="modal prizebox"><div class="confetti">✨❄️✨</div><div class="gift">🎁</div><div class="win">축하해요! 오늘의 행운은</div><h2 id="winText"></h2><p id="winNumber"></p><button class="primary" id="closeWin">다음 친구 뽑기 ❯</button></div></div>
<div class="overlay hidden" id="resultsOverlay"><div class="modal"><h2>📊 뽑기 현황</h2><p id="resultSummary"></p><div id="resultList"></div><div class="modalbuttons"><button class="secondary" id="closeResults">닫기</button></div></div></div>
<script>
(()=>{'use strict';const KEY='winter-raffle-premium-v1',PER=10000,$=id=>document.getElementById(id);let page=0;let data;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function defaults(){return {count:140,prizes:[{name:'특별 선물',qty:10},{name:'간식 선물',qty:30},{name:'문구 선물',qty:40},{name:'행운 선물',qty:60}],cards:null}}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function createCards(){let items=[];data.prizes.forEach(p=>{for(let i=0;i<p.qty;i++)items.push(p.name)});data.cards=shuffle(items).map(prize=>({prize,opened:false}));page=0;persist();render()}try{data=JSON.parse(localStorage.getItem(KEY))||defaults();if(!data||!Array.isArray(data.prizes)||!Array.isArray(data.cards)||data.cards.length!==data.count)throw Error('new')}catch(e){data=defaults();createCards()}function render(){let opened=data.cards.filter(c=>c.opened).length;$('remaining').textContent=data.count-opened;$('done').textContent=opened;$('total').textContent=data.count;$('bar').style.width=(opened/data.count*100)+'%';const pages=Math.ceil(data.count/PER);page=Math.max(0,Math.min(page,pages-1));$('pagecount').textContent=`${page+1} / ${pages} 페이지`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;const grid=$('grid');grid.replaceChildren();for(let i=page*PER;i<Math.min(data.count,(page+1)*PER);i++){const c=data.cards[i],b=document.createElement('button');b.className='tile'+(c.opened?' used':'');b.disabled=c.opened;b.setAttribute('aria-label',`${i+1}번 ${c.opened?'뽑기 완료':'뽑기'}`);const f=document.createElement('span');f.className='flake';f.textContent=c.opened?'✓':'❄';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(3,'0');b.append(f,n);b.addEventListener('click',()=>draw(i));grid.append(b)}}function draw(i){if(data.cards[i].opened)return;data.cards[i].opened=true;persist();render();$('winText').textContent=data.cards[i].prize;$('winNumber').textContent=`${i+1}번 눈꽃의 선물`;$('winOverlay').classList.remove('hidden')}function openSettings(){$('studentCount').value=data.count;$('prizeRows').replaceChildren();data.prizes.forEach(p=>addRow(p.name,p.qty));updateSum();$('settingsOverlay').classList.remove('hidden')}function addRow(name='',qty=0){const row=document.createElement('div');row.className='formrow';const input=document.createElement('input');input.type='text';input.placeholder='상품 이름';input.value=name;const num=document.createElement('input');num.type='number';num.min='0';num.max='1000';num.value=qty;const del=document.createElement('button');del.textContent='✕';del.title='삭제';del.onclick=()=>{row.remove();updateSum()};num.oninput=updateSum;row.append(input,num,del);$('prizeRows').append(row)}function updateSum(){const total=[...$('prizeRows').querySelectorAll('input[type=number]')].reduce((s,n)=>s+(Number(n.value)||0),0);$('sumText').textContent=`설정된 당첨 인원: ${total}명 / 전체 ${$('studentCount').value||0}명`}$('studentCount').oninput=updateSum;$('addPrize').onclick=()=>{addRow('',0);updateSum()};$('settingsBtn').onclick=openSettings;$('closeSettings').onclick=()=>$('settingsOverlay').classList.add('hidden');$('saveSettings').onclick=()=>{const count=Number($('studentCount').value);const rows=[...$('prizeRows').children];const prizes=rows.map(row=>({name:row.querySelector('input[type=text]').value.trim(),qty:Number(row.querySelector('input[type=number]').value)}));if(!Number.isInteger(count)||count<1||count>1000)return alert('학생 수는 1~1000명으로 입력해 주세요.');if(!prizes.length||prizes.some(p=>!p.name||!Number.isInteger(p.qty)||p.qty<0))return alert('상품 이름과 올바른 당첨 인원을 입력해 주세요.');if(prizes.reduce((s,p)=>s+p.qty,0)!==count)return alert('상품별 인원의 합계를 전체 학생 수와 같게 맞춰 주세요.');if(data.cards.some(c=>c.opened)&&!confirm('현재 뽑기 결과를 초기화하고 새로 만들까요?'))return;data={count,prizes,cards:null};createCards();$('settingsOverlay').classList.add('hidden')};$('closeWin').onclick=()=>$('winOverlay').classList.add('hidden');$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('resultsBtn').onclick=()=>{let opened=data.cards.filter(c=>c.opened).length;$('resultSummary').textContent=`총 ${data.count}명 중 ${opened}명 참여 · ${data.count-opened}명 남음`;$('resultList').replaceChildren();data.prizes.forEach(p=>{const used=data.cards.filter(c=>c.opened&&c.prize===p.name).length;const div=document.createElement('div');div.className='resultitem';const a=document.createElement('span');a.textContent=p.name;const b=document.createElement('span');b.textContent=`${used} / ${p.qty}명`;div.append(a,b);$('resultList').append(div)});$('resultsOverlay').classList.remove('hidden')};$('closeResults').onclick=()=>$('resultsOverlay').classList.add('hidden');$('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('winOverlay').classList.add('hidden')});render()})();
</script></body></html>
